[package]
name = "pictora"
version = "0.1.0"
description = "Pictora offline paint-by-numbers desktop application"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
percent-encoding = "=2.3.2"
tempfile = "=3.24.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
